name: TMS Full E2E & Backend Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-e2e-and-backend-verification:
    name: Full E2E & Backend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest openpyxl pyjwt requests

      - name: Run all 4 test suites & generate Excel reports
        env:
          USE_SQLITE_TEST: "1"
          DISABLE_RATE_LIMIT: "1"
          JWT_SECRET: "test-jwt-secret-aeroassist-2026"
          ADMIN_SECRET_KEY: "admin_aeroassist_2026"
        run: |
          python backend/export_all_test_excel.py

      - name: Run baseline load test
        env:
          USE_SQLITE_TEST: "1"
          DISABLE_RATE_LIMIT: "1"
        run: |
          cd backend
          python app.py &
          sleep 5
          python load_test.py || true
        continue-on-error: true

      - name: Upload Excel Test Reports to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: excel-test-reports
          path: |
            *.xlsx
            backend/*.xlsx
            Vulnerability Test Results/*.xlsx
          retention-days: 30
          if-no-files-found: warn
        if: always()

      - name: Auto-commit updated Excel test reports to repository
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.xlsx backend/*.xlsx "Vulnerability Test Results/*.xlsx" 2>/dev/null || true
          if git status --porcelain | grep -q '\.xlsx'; then
            git commit -m "Auto-update all test reports and executive summary [skip ci]"
            git push
          else
            echo "No Excel report changes to commit."
          fi
