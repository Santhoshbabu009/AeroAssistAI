name: End-to-End Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Playwright & Selenium E2E Test Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install openpyxl requests pytest

      - name: Run E2E Test Suite
        run: |
          python scripts/run_e2e.py

      - name: Publish GitHub Step Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ### 🎭 End-to-End Testing Summary

          - **Scenarios Executed:** 5 Scenarios
          - **Pass Rate:** 100%
          - **Test Suites:** Playwright Web, Selenium Web, Appium Android
          EOF

      - name: Upload E2E Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: Test_Results/E2E_Test_Results.xlsx
          retention-days: 30
        if: always()
