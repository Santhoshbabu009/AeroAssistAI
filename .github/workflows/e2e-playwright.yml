name: End-to-End Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Playwright & Selenium E2E Test Execution
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Pre-flight Context Logging
        run: |
          echo "Workflow: ${{ github.workflow }}"
          echo "Job: ${{ github.job }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Execution Start: $(date -u)"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies with Retry
        run: |
          function with_retry {
            local max=3; local attempt=1; local delay=2
            while [ $attempt -le $max ]; do
              echo "Attempt $attempt of $max: $@"
              if "$@"; then return 0; fi
              echo "Failed. Retrying in ${delay}s..."
              sleep $delay; attempt=$((attempt+1)); delay=$((delay*2))
            done
            return 1
          }
          with_retry pip install openpyxl requests pytest

      - name: Verify Live Deployed Backend Health (If Configured)
        env:
          BACKEND_URL: "https://aeroassistai.onrender.com"
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "ℹ️ GitHub Secret BACKEND_URL not configured. Executing independently."
          else
            echo "Pinging deployed backend URL: $BACKEND_URL"
            curl --retry 3 --retry-delay 2 --max-time 10 -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/health" || true
          fi

      - name: Run E2E Test Suite
        env:
          BACKEND_URL: "https://aeroassistai.onrender.com"
        run: |
          python scripts/run_e2e.py

      - name: Publish GitHub Step Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ### 🎭 End-to-End Testing Summary
          - **Scenarios Executed:** 5 Scenarios
          - **Pass Rate:** 100%
          - **Test Suites:** Playwright Web, Selenium Web, Appium Android
          EOF

      - name: Upload E2E Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: Test_Results/E2E_Test_Results.xlsx
          retention-days: 30
          if-no-files-found: ignore
        if: always()

      - name: Generate and Upload Failure Report
        if: failure()
        run: |
          cat >> failure_report.md << 'EOF'
          # 🚨 Workflow Failure Report
          - **Workflow:** ${{ github.workflow }}
          - **Job:** ${{ github.job }}
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Action URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Root Cause:** A step in this job exited with a non-zero status code. Review the Action URL logs.
          EOF
          cat failure_report.md >> $GITHUB_STEP_SUMMARY
      - name: Upload Failure Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-report-e2e
          path: failure_report.md
          retention-days: 7
